---
name: test (workflow_call)
on: workflow_call
permissions: {}
jobs:
  test-workflow:
    uses: suzuki-shunsuke/test-workflow/.github/workflows/test.yaml@0b89b9b4314282810bc944364380568708208eaa # v0.0.2
    with:
      aqua_version: v2.66.0
    permissions:
      contents: read
      pull-requests: read

  test-script:
    timeout-minutes: 20
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: ./aqua-installer
        env:
          AQUA_GITHUB_TOKEN: ${{github.token}}
      - run: echo "${AQUA_ROOT_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/aquaproj-aqua}/bin" >> "$GITHUB_PATH"
      - run: command -v aqua
      - run: aqua -v

  test-script-set-version:
    timeout-minutes: 20
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: bash -s -- -v v2.50.0 < aqua-installer
        env:
          AQUA_GITHUB_TOKEN: ${{github.token}}
      - run: echo "${AQUA_ROOT_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/aquaproj-aqua}/bin" >> "$GITHUB_PATH"
      - run: command -v aqua
      - run: aqua -v

  test-action-linux:
    timeout-minutes: 20
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          aqua_version: v2.66.0
          working_directory: tests
      - run: command -v aqua
      - run: aqua -v
      - run: ghalint -v
        env:
          GITHUB_TOKEN: ${{ github.token }}

  test-action-linux-packages:
    timeout-minutes: 20
    runs-on: ubuntu-26.04
    env:
      AQUA_DISABLE_LAZY_INSTALL: "true"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          aqua_version: v2.66.0
          packages: |
            # comment 1

            tfcmt # comment 2
            suzuki-shunsuke/pinact
      - run: tfcmt -v
      - run: pinact -v
      - name: ghalint must not be installed
        run: |
          if ghalint -v; then
            echo "::error ::ghalint should not be installed" >&2
            exit 1
          fi

  test-action-container:
    timeout-minutes: 20
    runs-on: ubuntu-26.04
    container:
      image: mirror.gcr.io/golang:1.25.4@sha256:5d73b7b83dd6e0258ff62832c93b6ea208fbb7727985d265fb49f75f81fc3d1f
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          aqua_version: v2.66.0
          working_directory: tests
      - run: command -v aqua
      - run: aqua -v
      - run: ghalint -v
        env:
          AQUA_GITHUB_TOKEN: ${{ github.token }}

  test-action-macos:
    timeout-minutes: 20
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          aqua_version: v2.66.0
          working_directory: tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: command -v aqua
      - run: aqua -v
      - run: ghalint -v
        env:
          AQUA_GITHUB_TOKEN: ${{ github.token }}

  test-action-windows-normal:
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          aqua_version: v2.66.0
      - run: command -v aqua
        shell: bash
      - run: aqua -v
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: ghalint -v
        shell: bash
        working-directory: tests
        env:
          AQUA_GITHUB_TOKEN: ${{ github.token }}

  test-action-windows-working_dir:
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          aqua_version: v2.66.0
          working_directory: tests

      - run: command -v aqua
        shell: bash
      - run: aqua -v
        shell: bash
      - run: ghalint -v
        env:
          AQUA_GITHUB_TOKEN: ${{ github.token }}
